name: Android Build

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'agrovision-mobile/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'agrovision-mobile/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (apk or aab)'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab

permissions:
  contents: read

env:
  NODE_VERSION: '18.x'

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: agrovision-mobile/package-lock.json

      - name: Setup Expo and EAS
        run: |
          npm install -g expo-cli eas-cli

      - name: Install dependencies
        working-directory: ./agrovision-mobile
        run: npm ci

      - name: Setup EAS credentials
        working-directory: ./agrovision-mobile
        run: |
          echo "EAS credentials configured"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK (Development)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'apk'
        working-directory: ./agrovision-mobile
        run: |
          eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android AAB (Production)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'aab'
        working-directory: ./agrovision-mobile
        run: |
          eas build --platform android --profile production --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Notify build started
        if: success()
        run: |
          echo "✅ Android build initiated successfully"
          echo "📱 Check EAS build dashboard for progress"
          echo "🔗 https://expo.dev/accounts/[your-account]/projects/agrovision-mobile/builds"

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: agrovision-mobile/.expo/
          retention-days: 7
