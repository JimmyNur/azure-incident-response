name: iOS Build

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      
      - name: Install dependencies
        run: |
          cd mobile
          npm ci
      
      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Configure EAS
        run: |
          cd mobile
          npx eas-cli@latest build:configure -p ios
      
      - name: Build IPA with EAS
        run: |
          cd mobile
          npx eas-cli@latest build --platform ios --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      
      - name: Download build artifact
        run: |
          cd mobile
          BUILD_ID=$(npx eas-cli@latest build:list --platform ios --limit 1 --json | jq -r '.[0].id')
          npx eas-cli@latest build:download --id $BUILD_ID --output ./agrovision.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: agrovision-ios
          path: mobile/agrovision.ipa
          retention-days: 30
      
      - name: Notify success
        run: |
          echo "✅ iOS build successful!"
          echo "Commit: ${{ github.sha }}"
          echo "IPA uploaded as artifact"
