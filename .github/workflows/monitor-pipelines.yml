name: Monitor Pipelines & Summarize

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  actions: read

jobs:
  summarize-pipelines:
    runs-on: ubuntu-latest
    outputs:
      success_count: ${{ steps.analyze.outputs.success_count }}
      failed_count: ${{ steps.analyze.outputs.failed_count }}
      timestamp: ${{ steps.analyze.outputs.timestamp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze pipeline status
        id: analyze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get workflow runs from the last 24 hours
          SINCE=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          echo "Fetching workflow runs since: $SINCE"
          
          # Get all workflow runs for this repository
          RUNS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/actions/runs?created=>$SINCE&per_page=100" \
            --jq '.workflow_runs')
          
          # Count successes and failures
          SUCCESS_COUNT=$(echo "$RUNS" | jq '[.[] | select(.conclusion == "success")] | length')
          FAILED_COUNT=$(echo "$RUNS" | jq '[.[] | select(.conclusion == "failure")] | length')
          
          echo "Success count: $SUCCESS_COUNT"
          echo "Failed count: $FAILED_COUNT"
          
          # Set outputs
          {
            echo "success_count=$SUCCESS_COUNT"
            echo "failed_count=$FAILED_COUNT"
            echo "timestamp=$TIMESTAMP"
          } >> "$GITHUB_OUTPUT"
          
          # Generate DEPLOYMENT_STATUS.md
          cat > DEPLOYMENT_STATUS.md << EOF
          # 📊 Deployment Status Report
          
          **Repository:** ${{ github.repository }}
          **Last Updated:** $TIMESTAMP
          
          ## 📈 Build Statistics (Last 24 Hours)
          
          - ✅ **Successful Builds:** $SUCCESS_COUNT
          - ❌ **Failed Builds:** $FAILED_COUNT
          
          ## 🔗 Quick Links
          
          - [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions)
          - [Latest Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ---
          *This report is automatically generated by the Monitor Pipelines workflow.*
          EOF
          
          cat DEPLOYMENT_STATUS.md

      - name: Commit deployment status
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add DEPLOYMENT_STATUS.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update deployment status report [skip ci]"
            git push
          fi

  notify-slack:
    runs-on: ubuntu-latest
    needs: summarize-pipelines
    if: always()  # Run even if previous job has issues
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUCCESS_COUNT: ${{ needs.summarize-pipelines.outputs.success_count }}
          FAILED_COUNT: ${{ needs.summarize-pipelines.outputs.failed_count }}
          TIMESTAMP: ${{ needs.summarize-pipelines.outputs.timestamp }}
        run: |
          # Prepare Slack message payload
          DEPLOYMENT_STATUS_URL="${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/DEPLOYMENT_STATUS.md"
          ACTIONS_URL="${{ github.server_url }}/${{ github.repository }}/actions"
          CURRENT_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # Create JSON payload for Slack
          PAYLOAD=$(cat <<EOF
          {
            "text": "🔔 Pipeline Status Update",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🧱 ${{ github.repository }} - Monitor Pipelines & Summarize",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "⏱ *Timestamp:*\n${TIMESTAMP}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "✅ *Successful Builds:*\n${SUCCESS_COUNT}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "❌ *Failed Builds:*\n${FAILED_COUNT}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "📊 *Status Report:*\n<${DEPLOYMENT_STATUS_URL}|View DEPLOYMENT_STATUS.md>"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "🔗 <${ACTIONS_URL}|View All GitHub Actions> | <${CURRENT_RUN_URL}|Current Run>"
                }
              }
            ]
          }
          EOF
          )
          
          # Send to Slack
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "Sending notification to Slack..."
            if curl -X POST \
              -H 'Content-Type: application/json' \
              -d "$PAYLOAD" \
              "$SLACK_WEBHOOK_URL" \
              --fail --silent --show-error; then
              echo "✅ Slack notification sent successfully!"
            else
              echo "❌ Failed to send Slack notification"
              exit 1
            fi
          else
            echo "⚠️  SLACK_WEBHOOK_URL not configured. Skipping Slack notification."
          fi
